# Free-tier Yuki website. NOAA publishing remains a separate, opt-in workflow.
services:
  - type: web
    name: yuki-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: python -m uvicorn forecast_bust.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v2/health
    envVars:
      - key: PYTHONPATH
        value: src
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: FORECAST_BUST_V2_CACHE_SIZE
        value: "1"
      - key: FORECAST_BUST_V2_ANALOG_INDEX_CACHE_SIZE
        value: "1"
      - key: FORECAST_BUST_CORS_ORIGINS
        sync: false

  - type: web
    name: yuki-site
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
